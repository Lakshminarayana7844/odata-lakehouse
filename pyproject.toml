[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odata-lakehouse"
version = "0.1.0"
description = "Sync OData v4 services into a local Parquet lakehouse with incremental watermarks, schema contracts and dbt scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyarrow>=14"]

[project.scripts]
odata-lakehouse = "odata_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
